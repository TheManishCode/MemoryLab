# Weekly, grouped so one PR per ecosystem arrives instead of dozens. Every update PR goes through the same required checks (gate, security).
# Security updates (advisories) are opened by Dependabot alerts independently of this schedule once they are enabled in the repository settings.
version: 2
updates:
  - package-ecosystem: github-actions        # keeps the SHA pins in .github/workflows current (the version comment is updated with the SHA)
    directory: /
    schedule: {interval: weekly, day: monday}
    cooldown: {default-days: 7}                 # a release must age 7 days before an update PR opens (supply-chain safety)
    groups:
      actions: {patterns: ["*"]}
    commit-message: {prefix: "ci"}
    labels: [dependencies, github-actions]

  - package-ecosystem: npm                   # apps/web
    directory: /apps/web
    schedule: {interval: weekly, day: monday}
    cooldown: {default-days: 7}                 # a release must age 7 days before an update PR opens (supply-chain safety)
    groups:
      npm-minor-patch: {update-types: [minor, patch]}
    commit-message: {prefix: "web"}
    labels: [dependencies, web]

  - package-ecosystem: uv                    # the Python workspace (uv.lock at the root)
    directory: /
    schedule: {interval: weekly, day: monday}
    cooldown: {default-days: 7}                 # a release must age 7 days before an update PR opens (supply-chain safety)
    groups:
      python-minor-patch: {update-types: [minor, patch]}
    commit-message: {prefix: "py"}
    labels: [dependencies, python]

  - package-ecosystem: docker                # base images in infra/docker/Dockerfile.*
    directory: /infra/docker
    schedule: {interval: weekly, day: monday}
    cooldown: {default-days: 7}                 # a release must age 7 days before an update PR opens (supply-chain safety)
    groups:
      docker-base-images: {patterns: ["*"]}
    commit-message: {prefix: "docker"}
    labels: [dependencies, docker]
