[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orchestrator"
version = "0.1.0"
description = "Memory Lab orchestrator: queue, limits, one hardened container per run, heartbeat kill"
requires-python = ">=3.14"
dependencies = ["labharness", "runlog", "ingest", "httpx>=0.27", "fastapi>=0.115", "uvicorn>=0.30", "psycopg[binary,pool]>=3.3.8"]

[dependency-groups]
dev = ["worker", "egressproxy"]

[tool.uv.sources]
labharness = { workspace = true }
runlog = { workspace = true }
ingest = { workspace = true }
worker = { workspace = true }
egressproxy = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning", "error::pytest.PytestUnhandledThreadExceptionWarning"]
markers = ["docker: needs a local Docker daemon and builds/uses images labelled memorylab.owner"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF059", "RUF015", "S603", "S607"]

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
