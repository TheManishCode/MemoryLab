[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "accounts"
version = "0.1.0"
description = "Memory Lab accounts service: the only holder (with ingest and the orchestrator reaper) of service-role access, used to erase an account"
requires-python = ">=3.14"
dependencies = ["ingest", "httpx>=0.27", "fastapi>=0.115", "uvicorn>=0.30", "psycopg[binary,pool]>=3.3.8"]

[tool.uv.sources]
ingest = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/accounts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF059", "RUF015"]

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
